name: Inspect Issue 31 Vercel access

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-vercel:
    if: github.head_ref == 'agent/fix-memorization-runtime-update'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_DEPLOYMENT_URL: https://quran-school-platform-jv8l9fgub-wadaker1437-gmailcoms-projects.vercel.app
      PROD_ALIAS: quran-school-platform-livid.vercel.app
    steps:
      - name: Report credential availability
        run: |
          python - <<'PY'
          import os
          for name in ['VERCEL_TOKEN','VERCEL_ORG_ID','VERCEL_PROJECT_ID']:
              print(f'{name}_AVAILABLE={bool(os.environ.get(name))}')
          PY

      - name: Inspect Vercel project and aliases
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel --version
          vercel whoami --token "$VERCEL_TOKEN"
          echo '--- deployment inspect ---'
          vercel inspect "$PROD_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" || true
          echo '--- project deployments ---'
          vercel ls quran-school-platform --token "$VERCEL_TOKEN" || true
          echo '--- aliases ---'
          vercel alias ls --token "$VERCEL_TOKEN" || true
