name: Patch Issue 31 final test template v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-memorization-runtime-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-runtime-update
      - name: Remove final stale-mode badge assertion
        run: |
          python <<'PY'
          import re
          from pathlib import Path
          path=Path('.github/workflows/issue31-apply-fix.yml')
          source=path.read_text(encoding='utf-8')
          pattern=r'(?m)^[ \t]*expect\(screen\.getByText\(/\^وضع التعديل ·/\)\)\.toBeInTheDocument\(\);\n'
          matches=list(re.finditer(pattern,source))
          if len(matches) < 2:
              raise SystemExit(f'expected at least two badge assertions, found {len(matches)}')
          match=matches[-1]
          path.write_text(source[:match.start()]+source[match.end():],encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue31-apply-fix.yml
          git commit -m "test: correct stale runtime assertion"
          git push origin HEAD:agent/fix-memorization-runtime-update
