name: Repair Issue 29 on Draft PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-and-validate:
    if: github.head_ref == 'agent/fix-memorization-edit-mode' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-edit-mode
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Apply focused fix
        run: python scripts/apply_issue_29_fix.py patch

      - name: Run complete validation
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee /tmp/all-tests.log
          node --test tests/memorization-interface.test.mjs | tee /tmp/interface-tests.log
          node --test tests/memorization-database.test.mjs | tee /tmp/database-tests.log
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build
          git diff --check

      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Memorization.tsx tests/memorization-interface.test.mjs
          git commit -m "fix: keep memorization form in edit mode"
          git push origin HEAD:agent/fix-memorization-edit-mode
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Confirm Vercel on tested fix commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${FIX_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel state: $state"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Vercel did not report success for ${FIX_SHA}" >&2
          exit 1

      - name: Update documentation and remove temporary repair files
        run: |
          export FIX_SHA
          python scripts/apply_issue_29_fix.py docs
          rm .github/workflows/apply-issue-29-fix.yml
          rm .github/workflows/pull-request-issue29.yml
          rm scripts/apply_issue_29_fix.py
          git add docs/work-handoff .github/workflows scripts/apply_issue_29_fix.py
          git commit -m "docs: record issue 29 fix validation"
          git push origin HEAD:agent/fix-memorization-edit-mode
