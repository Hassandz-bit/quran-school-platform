name: Patch Issue 31 final test template v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-memorization-runtime-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-runtime-update
      - name: Remove last badge assertion by normalized line
        run: |
          python <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/issue31-apply-fix.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          target='expect(screen.getByText(/^وضع التعديل ·/)).toBeInTheDocument();'
          indices=[index for index,line in enumerate(lines) if line.strip()==target]
          if len(indices)<2:
              raise SystemExit(f'expected at least two badge assertions, found {len(indices)}')
          lines.pop(indices[-1])
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue31-apply-fix.yml
          git commit -m "test: correct stale runtime assertion"
          git push origin HEAD:agent/fix-memorization-runtime-update
