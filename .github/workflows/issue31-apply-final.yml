name: Apply final Issue 31 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-memorization-runtime-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-runtime-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm add -D --ignore-workspace vitest@4.1.10 jsdom@latest @testing-library/react@latest @testing-library/user-event@latest @testing-library/jest-dom@latest
      - name: Generate final focused files
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path

          def extract(source_path: str, output_path: str) -> None:
              source=Path(source_path).read_text(encoding='utf-8')
              pattern=rf"          cat > {re.escape(output_path)} <<'EOF'\n(.*?)\n          EOF"
              match=re.search(pattern,source,re.S)
              if not match: raise SystemExit(f'missing embedded {output_path} in {source_path}')
              content='\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())+'\n'
              target=Path(output_path); target.parent.mkdir(parents=True,exist_ok=True); target.write_text(content,encoding='utf-8')

          extract('.github/workflows/issue31-apply-fix.yml','vite.config.ts')
          extract('.github/workflows/issue31-apply-fix.yml','client/src/lib/app-version.ts')
          extract('.github/workflows/issue31-runtime-behavior-v5.yml','tests/memorization-runtime-behavior.test.tsx')

          Path('vitest.config.ts').write_text('''import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { defineConfig } from "vitest/config";

          const root = path.dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            define: { __APP_VERSION__: JSON.stringify("test123") },
            resolve: { alias: { "@": path.resolve(root, "client/src") } },
            test: { environment: "jsdom", globals: true },
          });
          '''.replace('          ','') ,encoding='utf-8')

          Path('tests/app-version.test.ts').write_text('''import { describe, expect, test } from "vitest";
          import {
            APP_VERSION,
            StaleAppVersionError,
            assertCurrentAppVersion,
          } from "@/lib/app-version";

          const response = (version: string) =>
            Promise.resolve(
              new Response(
                `<html><head><meta name="app-version" content="${version}" /></head></html>`,
                { status: 200 }
              )
            );

          describe("application version guard", () => {
            test("accepts the currently loaded build", async () => {
              expect(APP_VERSION).toBe("test123");
              await expect(
                assertCurrentAppVersion(() => response("test123"))
              ).resolves.toBeUndefined();
            });

            test("rejects a stale loaded build before a write", async () => {
              await expect(
                assertCurrentAppVersion(() => response("new4567"))
              ).rejects.toBeInstanceOf(StaleAppVersionError);
            });
          });
          '''.replace('          ','') ,encoding='utf-8')

          page_path=Path('client/src/pages/Memorization.tsx')
          page=page_path.read_text(encoding='utf-8')
          anchor='import { useAuth } from "@/contexts/AuthContext";\n'
          version_import='import {\n  APP_VERSION,\n  assertCurrentAppVersion,\n  isStaleAppVersionError,\n} from "@/lib/app-version";\n'
          if '@/lib/app-version' not in page:
              if anchor not in page: raise SystemExit('auth import anchor missing')
              page=page.replace(anchor,anchor+version_import,1)
          page,count=re.subn(r'(?m)^(\s*)const result = await saveMemorizationRecord\(\{',r'\1await assertCurrentAppVersion();\n\1const result = await saveMemorizationRecord({',page,count=1)
          if count!=1: raise SystemExit(f'save insertion count {count}')
          page,count=re.subn(r'(?m)^(\s*)const message = getMemorizationErrorMessage\(error\);$',r'\1const message = isStaleAppVersionError(error)\n\1  ? "توجد نسخة أحدث من المنصة. أعد تحميل الصفحة قبل الحفظ لتجنب إنشاء سجل غير مقصود."\n\1  : getMemorizationErrorMessage(error);',page,count=1)
          if count!=1: raise SystemExit(f'catch replacement count {count}')
          old='<p className="text-xs text-white/65">{school?.name}</p>'
          new='<p className="text-xs text-white/65">\n              {school?.name} · النسخة {APP_VERSION}\n            </p>'
          if old not in page: raise SystemExit('school version anchor missing')
          page=page.replace(old,new,1)
          page_path.write_text(page,encoding='utf-8')

          package_path=Path('package.json')
          package=json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['test:runtime']='vitest --config vitest.config.ts run tests/memorization-runtime-behavior.test.tsx tests/app-version.test.ts'
          package['scripts']['build']='node --test tests/*.test.mjs && node --test tests/memorization-interface.test.mjs && node --test tests/memorization-database.test.mjs && pnpm test:runtime && tsc --noEmit && vite build && git diff --check'
          package_path.write_text(json.dumps(package,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/issue31-*.yml
      - name: Validate everything
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee /tmp/all-tests.log
          node --test tests/memorization-interface.test.mjs | tee /tmp/interface-tests.log
          node --test tests/memorization-database.test.mjs | tee /tmp/database-tests.log
          pnpm test:runtime | tee /tmp/runtime-tests.log
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build
          git diff --check
          ! grep -R "\.delete(" client/src/pages/Memorization.tsx client/src/lib/app-version.ts tests/memorization-runtime-behavior.test.tsx tests/app-version.test.ts
          ! grep -R "service_role\|SUPABASE_SERVICE" client/src/pages/Memorization.tsx client/src/lib/app-version.ts tests/memorization-runtime-behavior.test.tsx tests/app-version.test.ts
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: block stale memorization runtime writes"
          git push origin HEAD:agent/fix-memorization-runtime-update
          git rev-parse HEAD
