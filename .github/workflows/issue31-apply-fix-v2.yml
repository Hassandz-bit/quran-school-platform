name: Apply Issue 31 stale-runtime guard v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/fix-memorization-runtime-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-runtime-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm add -D --ignore-workspace vitest@4.1.10 jsdom@latest @testing-library/react@latest @testing-library/user-event@latest @testing-library/jest-dom@latest
      - name: Generate focused code and tests
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path('.github/workflows/issue31-apply-fix.yml').read_text(encoding='utf-8')

          def extract(path: str) -> None:
              pattern = rf"          cat > {re.escape(path)} <<'EOF'\n(.*?)\n          EOF"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'embedded file not found: {path}')
              lines = match.group(1).splitlines()
              content = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          for embedded in [
              'vite.config.ts',
              'client/src/lib/app-version.ts',
              'vitest.config.ts',
              'tests/memorization-runtime-behavior.test.tsx',
          ]:
              extract(embedded)

          page_path = Path('client/src/pages/Memorization.tsx')
          page = page_path.read_text(encoding='utf-8')

          import_line = 'import { useAuth } from "@/contexts/AuthContext";\n'
          version_import = '''import {
            APP_VERSION,
            assertCurrentAppVersion,
            isStaleAppVersionError,
          } from "@/lib/app-version";
          '''
          version_import = '\n'.join(line[10:] if line.startswith('          ') else line for line in version_import.splitlines()) + '\n'
          if '@/lib/app-version' not in page:
              if import_line not in page:
                  raise SystemExit('auth import anchor missing')
              page = page.replace(import_line, import_line + version_import, 1)

          page, count = re.subn(
              r'(?m)^(\s*)const result = await saveMemorizationRecord\(\{',
              r'\1await assertCurrentAppVersion();\n\1const result = await saveMemorizationRecord({',
              page,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'save insertion count={count}')

          page, count = re.subn(
              r'(?m)^(\s*)const message = getMemorizationErrorMessage\(error\);$',
              r'\1const message = isStaleAppVersionError(error)\n\1  ? "توجد نسخة أحدث من المنصة. أعد تحميل الصفحة قبل الحفظ لتجنب إنشاء سجل غير مقصود."\n\1  : getMemorizationErrorMessage(error);',
              page,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'catch replacement count={count}')

          school_line = '<p className="text-xs text-white/65">{school?.name}</p>'
          school_block = '''<p className="text-xs text-white/65">
              {school?.name} · النسخة {APP_VERSION}
            </p>'''
          if school_line not in page:
              raise SystemExit('school version anchor missing')
          page = page.replace(school_line, school_block, 1)
          page_path.write_text(page, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['test:runtime'] = 'vitest --config vitest.config.ts run tests/memorization-runtime-behavior.test.tsx'
          package['scripts']['build'] = (
              'node --test tests/*.test.mjs && '
              'node --test tests/memorization-interface.test.mjs && '
              'node --test tests/memorization-database.test.mjs && '
              'pnpm test:runtime && tsc --noEmit && vite build && git diff --check'
          )
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/issue31-*.yml
      - name: Run complete validation
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee /tmp/all-tests.log
          node --test tests/memorization-interface.test.mjs | tee /tmp/interface-tests.log
          node --test tests/memorization-database.test.mjs | tee /tmp/database-tests.log
          pnpm test:runtime | tee /tmp/runtime-tests.log
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build
          git diff --check
          ! grep -R "\.delete(" client/src/pages/Memorization.tsx client/src/lib/app-version.ts tests/memorization-runtime-behavior.test.tsx
          ! grep -R "service_role\|SUPABASE_SERVICE" client/src/pages/Memorization.tsx client/src/lib/app-version.ts tests/memorization-runtime-behavior.test.tsx
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: block stale memorization runtime writes"
          git push origin HEAD:agent/fix-memorization-runtime-update
          git rev-parse HEAD
