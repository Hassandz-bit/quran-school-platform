name: Launch Readiness Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "supabase/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/launch-readiness-validation.yml"

permissions:
  contents: read

concurrency:
  group: launch-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Full launch readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify isolated runner tools
        run: |
          node --version
          corepack --version
          deno --version
          docker --version
          docker info

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm 10.4.1
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application build and full JS/TS/runtime suite
        run: pnpm build

      - name: Validate teacher invitation migration
        run: pnpm test:teacher-invitations:migration

      - name: Validate memorization teacher RPC migration
        run: pnpm test:memorization-teacher-rpc:migration

      - name: Validate guardian security foundation migration
        run: pnpm test:guardian-security:migration

      - name: Validate guardian invitation migration
        run: pnpm test:guardian-invitations:migration

      - name: Validate guardian parent academic migration
        run: pnpm test:guardian-parent-academic:migration

      - name: Validate guardian parent finance migration
        run: pnpm test:guardian-parent-finance:migration

      - name: Validate teacher invitation Edge Function
        run: pnpm test:teacher-invitations:function

      - name: Validate guardian invitation Edge Function
        run: pnpm test:guardian-invitations:function

      - name: Final working-tree whitespace check
        run: git diff --check
