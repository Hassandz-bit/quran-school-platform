name: Diagnose Issue 31 bundles

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-memorization-runtime-update'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROD_SHA: e4416758218ee62d4eff2c567900cdb7b7f419fc
      PREVIEW_SHA: 2ed5971ff5c46a4cf291df79138655e5217a1498
      PROD_URL: https://quran-school-platform-livid.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment URLs
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          deployments = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/deployments?per_page=100'
          ], text=True))
          resolved = {}
          for label, sha in {'production': os.environ['PROD_SHA'], 'preview': os.environ['PREVIEW_SHA']}.items():
              print(f'::group::{label}:{sha}')
              for dep in [d for d in deployments if d.get('sha') == sha]:
                  statuses = json.loads(subprocess.check_output([
                      'gh', 'api', f"repos/{repo}/deployments/{dep['id']}/statuses?per_page=100"
                  ], text=True))
                  print(json.dumps({k: dep.get(k) for k in ['id','sha','ref','environment','production_environment','transient_environment','created_at']}, ensure_ascii=False))
                  for status in statuses:
                      summary = {k: status.get(k) for k in ['state','environment','environment_url','log_url','created_at']}
                      print(json.dumps(summary, ensure_ascii=False))
                      if status.get('state') == 'success' and status.get('environment_url'):
                          resolved.setdefault(label, status['environment_url'])
              combined = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/commits/{sha}/status'], text=True))
              vercel = next((s for s in combined.get('statuses',[]) if s.get('context') == 'Vercel'), None)
              print('status_target=', vercel.get('target_url') if vercel else None)
              print('::endgroup::')
          Path('resolved-fast.json').write_text(json.dumps(resolved, ensure_ascii=False, indent=2))
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f"PREVIEW_URL={resolved.get('preview','')}\n")
              env.write(f"DEPLOYMENT_PROD_URL={resolved.get('production','')}\n")
          print('resolved=', json.dumps(resolved, ensure_ascii=False))
          PY

      - name: Inspect public HTML and JavaScript
        run: |
          set -u
          mkdir -p evidence-fast
          python <<'PY'
          import os, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          urls = {
              'production_alias': os.environ['PROD_URL'].rstrip('/') + '/',
              'production_deployment': os.environ.get('DEPLOYMENT_PROD_URL','').rstrip('/') + '/',
              'preview_deployment': os.environ.get('PREVIEW_URL','').rstrip('/') + '/',
          }
          needles = ['وضع التعديل','الحفظ القادم سيعدّل السجل الحالي','تم حفظ السجل، وأصبح النموذج في وضع التعديل']
          for label, url in urls.items():
              if url == '/':
                  print(f'{label}: missing URL')
                  continue
              folder = Path('evidence-fast') / label
              folder.mkdir(parents=True, exist_ok=True)
              headers, html = folder/'headers.txt', folder/'index.html'
              print(f'::group::{label} {url}')
              start = time.monotonic()
              result = subprocess.run([
                  'curl','-sS','-L','--compressed','--connect-timeout','10','--max-time','30',
                  '-D',str(headers),'-o',str(html),'-w','HTTP=%{http_code} EFFECTIVE=%{url_effective} TIME=%{time_total}\n',url
              ], text=True, capture_output=True)
              print(result.stdout.strip())
              if result.stderr:
                  print('curl_stderr=', result.stderr.strip())
              print(f'wall_seconds={time.monotonic()-start:.3f}')
              if headers.exists():
                  for line in headers.read_text(errors='replace').splitlines():
                      lower=line.lower()
                      if line.startswith('HTTP/') or lower.startswith(('cache-control:','age:','etag:','x-vercel-cache:','x-vercel-id:','server:','date:','location:')):
                          print(line)
              if not html.exists():
                  print('No HTML body')
                  print('::endgroup::')
                  continue
              source=html.read_text(errors='replace')
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',source)
              print('scripts=',scripts)
              combined=''
              for i,src in enumerate(scripts):
                  asset=urljoin(url,src)
                  name=Path(urlparse(asset).path).name or f'asset-{i}.js'
                  out=folder/name
                  r=subprocess.run([
                      'curl','-sS','-L','--compressed','--connect-timeout','10','--max-time','30','-o',str(out),asset
                  ], text=True, capture_output=True)
                  print(f'asset={asset} rc={r.returncode} bytes={out.stat().st_size if out.exists() else 0}')
                  if out.exists(): combined+='\n'+out.read_text(errors='replace')
              for needle in needles:
                  print(f'needle[{needle}]={needle in combined}')
              print('::endgroup::')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue31-bundle-evidence-fast
          path: |
            resolved-fast.json
            evidence-fast/
          if-no-files-found: warn
