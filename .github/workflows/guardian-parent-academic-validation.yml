name: Guardian Parent Academic Validation

on:
  pull_request:
    paths:
      - "supabase/019_guardian_parent_academic_reads.sql"
      - "client/src/App.tsx"
      - "client/src/components/ParentRoute.tsx"
      - "client/src/components/ParentShell.tsx"
      - "client/src/lib/parent-portal.ts"
      - "client/src/pages/ParentHome.tsx"
      - "client/src/pages/ParentStudent.tsx"
      - "client/src/pages/PostLoginRedirect.tsx"
      - "tests/guardian-parent-academic*"
      - "tests/run-guardian-parent-academic-migration-test.sh"
      - ".github/workflows/guardian-parent-academic-validation.yml"

permissions:
  contents: read

jobs:
  guardian-parent-academic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:guardian-parent-academic:migration
      - run: node --experimental-strip-types --test tests/guardian-parent-academic.test.mjs
      - run: pnpm exec vitest --config vitest.config.ts run tests/guardian-parent-academic-runtime.test.ts
      - run: pnpm check
      - run: pnpm exec vite build
      - run: git diff --check
