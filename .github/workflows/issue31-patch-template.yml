name: Patch Issue 31 final test template

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-memorization-runtime-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-memorization-runtime-update
      - name: Correct stale-version assertion
        run: |
          python <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/issue31-apply-fix.yml')
          source=path.read_text(encoding='utf-8')
          old='''              expect(\n                screen.getByText(/توجد نسخة أحدث من المنصة/)\n              ).toBeInTheDocument();\n              expect(screen.getByText(/^وضع التعديل ·/)).toBeInTheDocument();'''
          new='''              expect(\n                screen.getByText(/توجد نسخة أحدث من المنصة/)\n              ).toBeInTheDocument();'''
          if old not in source:
              raise SystemExit('stale assertion template not found')
          path.write_text(source.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue31-apply-fix.yml
          git commit -m "test: correct stale runtime assertion"
          git push origin HEAD:agent/fix-memorization-runtime-update
