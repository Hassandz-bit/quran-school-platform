name: PR 38 Teacher Invitation Validation

on:
  push:
    branches:
      - agent/issue37-pending-invite-activation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr38-teacher-invitations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-teacher-invitations:
    name: Validate teacher invitations
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify isolated runner tools
        run: |
          node --version
          corepack --version
          deno --version
          docker --version
          docker info

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm 10.4.1
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node test suite
        run: pnpm test

      - name: Run TypeScript check
        run: pnpm check

      - name: Build application
        run: pnpm build

      - name: Check whitespace in git diff
        run: git diff --check

      - name: Run teacher invitation migration test
        run: pnpm test:teacher-invitations:migration

      - name: Run memorization teacher RPC migration test
        shell: bash
        run: |
          set +e
          pnpm test:memorization-teacher-rpc:migration 2>&1 | tee /tmp/memorization-teacher-rpc.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -n 40 /tmp/memorization-teacher-rpc.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=tests/memorization-teacher-rpc-assertions.sql::$diagnostic"
          fi
          exit "$status"

      - name: Run teacher invitation Edge Function test
        run: pnpm test:teacher-invitations:function
