name: Guardian Notification Center Validation

on:
  pull_request:
    branches:
      - develop/v2
    paths:
      - "supabase/025_guardian_directory_notification_center.sql"
      - "client/src/lib/guardians.ts"
      - "client/src/lib/notifications.ts"
      - "client/src/pages/Guardians.tsx"
      - "client/src/pages/Notifications.tsx"
      - "client/src/components/ParentShell.tsx"
      - "client/src/lib/app-navigation.ts"
      - "client/src/App.tsx"
      - "tests/guardian-notification-center*"
      - ".github/workflows/guardian-notification-center-validation.yml"
      - ".github/workflows/launch-readiness-validation.yml"

permissions:
  contents: read

jobs:
  notification-center:
    name: Validate guardian directory and notification center
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker
        run: docker info

      - name: Validate Migration 025 on PostgreSQL 17
        run: bash tests/run-guardian-notification-center-migration-test.sh

      - name: Validate client safety and routing contracts
        run: node --test tests/guardian-notification-center.test.mjs

      - name: Check whitespace
        run: git diff --check
