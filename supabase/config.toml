project_id = "quran-school-platform"

[functions.invite-teacher]
verify_jwt = true

[functions.invite-guardian]
verify_jwt = true

# This function has two authenticated entry paths: a signed-in attendance user
# validated inside authorizeScope(), or the server-only Cron secret validated
# inside authorizeCron(). Gateway JWT verification must therefore stay off for
# this function only; requests without either credential fail closed in handler.
[functions.dispatch-guardian-notifications]
verify_jwt = false

# The import function validates the bearer token itself before parsing or staging
# any workbook. This keeps authorization testable and fail-closed inside handler.
[functions.import-students]
verify_jwt = false

# Restore preparation validates the caller and permission inside the handler.
[functions.prepare-school-restore]
verify_jwt = false

# Scheduled backups and retention are triggered by Supabase Cron with a server-only secret.\n[functions.run-scheduled-school-backups]\nverify_jwt = false\n